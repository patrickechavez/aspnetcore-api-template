services:
  postgres:
    image: postgres:17
    container_name: apitemplate-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: apitemplate
      POSTGRES_USER: appuser
      # Local throwaway container only — this port is not exposed beyond the host.
      # The application reads its connection string from User Secrets in development
      # and from the ConnectionStrings__DefaultConnection environment variable elsewhere.
      POSTGRES_PASSWORD: localdevpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d apitemplate"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
